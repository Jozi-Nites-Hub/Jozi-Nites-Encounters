  <script>
    // === FIREBASE CONFIG - REPLACE WITH YOUR OWN ===
  const firebaseConfig = {
    apiKey: "AIzaSyAuMwwtAD7vU5LO74cXf88QUJuPbrGz-D8",
    authDomain: "jozinites-blackspice.firebaseapp.com",
    projectId: "jozinites-blackspice",
    storageBucket: "jozinites-blackspice.firebasestorage.app",
    messagingSenderId: "298622809208",
    appId: "1:298622809208:web:b52f1f694f6fd60f03e98d",
    measurementId: "G-F6RSBBR9ZG"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let currentUser = null;
    let mediaRecorder;
    let audioChunks = [];

    let currentLevel = 'all';

    function showSection(sec) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(sec).classList.add('active');
    }

    // Auth
    function signUp() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, pass).then(() => alert("Account created! Welcome to BlackSpice 👑"));
    }

    function signIn() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, pass).then(user => {
        currentUser = user.user;
        updateUI();
      });
    }

    function anonymousLogin() {
      auth.signInAnonymously().then(user => {
        currentUser = user.user;
        updateUI();
      });
    }

    function logout() {
      auth.signOut();
      document.getElementById('user-info').style.display = 'none';
      document.getElementById('auth-section').style.display = 'block';
    }

    function updateUI() {
      if (currentUser) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('user-email').textContent = currentUser.email || "Black King/Queen";
      }
    }

    // Questions & Dares
    function setLevel(lvl) { currentLevel = lvl; newQuestion(); }
    function newQuestion() {
      let filtered = currentLevel === 'all' ? questions : questions.filter(q => q.level === currentLevel);
      const q = filtered[Math.floor(Math.random() * filtered.length)] || questions[0];
      document.getElementById('qlist').innerHTML = `
        <div class="level ${q.level}">${q.level.toUpperCase()}</div>
        <p style="font-size:1.3em; line-height:1.6;">${q.text}</p>
      `;
    }

    function newDare() {
      const dare = dares[Math.floor(Math.random() * dares.length)];
      document.getElementById('dlist').innerHTML = `<p style="font-size:1.25em;">${dare}</p>`;
    }

    // Photo
    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          document.getElementById('photoPreview').innerHTML = `<img src="${ev.target.result}">`;
        };
        reader.readAsDataURL(file);
      }
    }

    // Voice Notes
    function startRecording() {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
          const audioUrl = URL.createObjectURL(audioBlob);
          document.getElementById('voicePreview').innerHTML = `
            <audio controls src="${audioUrl}"></audio><br>
            <small>Sexy voice note ready for your partner 🔥</small>
          `;
        };
        mediaRecorder.start();
      });
    }

    function stopRecording() {
      if (mediaRecorder) mediaRecorder.stop();
    }

    function logSession() {
      const date = document.getElementById('sessionDate').value || "tonight";
      alert(`Session logged for ${date} — Keep that Black passion burning hot! 👑🔥`);
    }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) updateUI();
    });

    window.onload = () => {
      newQuestion();
      newDare();
    };
  </script>
